<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Virtual Singles Mixer · the Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --ground: #f3f1f6;
    --surface: #ffffff;
    --surface-2: #eae6f0;
    --ink: #241f2c;
    --muted: #6b6476;
    --line: #d9d3e2;
    --accent: #6a2c5f;
    --accent-ink: #ffffff;
    --accent-soft: #f1e3ee;
    --wait: #8a5200;
    --wait-soft: #fff1dc;
    --doing: #2a5a9a;
    --doing-soft: #e3edfa;
    --done: #24693f;
    --done-soft: #dff0e5;
    --shadow: 0 18px 40px rgba(36, 31, 44, 0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15121b;
      --surface: #201b28;
      --surface-2: #2b2535;
      --ink: #ede8f2;
      --muted: #a59db1;
      --line: #3a3346;
      --accent: #cf87bf;
      --accent-ink: #1b1220;
      --accent-soft: #3a2436;
      --wait: #f0b25c;
      --wait-soft: #3d2c12;
      --doing: #8fb6ec;
      --doing-soft: #1e2d44;
      --done: #7fcb9a;
      --done-soft: #17342a;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15121b;
    --surface: #201b28;
    --surface-2: #2b2535;
    --ink: #ede8f2;
    --muted: #a59db1;
    --line: #3a3346;
    --accent: #cf87bf;
    --accent-ink: #1b1220;
    --accent-soft: #3a2436;
    --wait: #f0b25c;
    --wait-soft: #3d2c12;
    --doing: #8fb6ec;
    --doing-soft: #1e2d44;
    --done: #7fcb9a;
    --done-soft: #17342a;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
  p { margin: 0; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }


  .desk { max-width: 560px; margin: 0 auto; padding: 8px 0 40px; }
  .screen { display: flex; padding: 16px 22px 28px; flex-direction: column; gap: 18px; }
  .back { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 700; }
  .lead { font-size: 13px; color: var(--muted); }
  .screen h2 { font-size: 26px; }
  .screen h3 { font-size: 18px; }

  .next {
    background: var(--accent-soft); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .next .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .next p.big { font-family: "Fraunces", Georgia, serif; font-size: 22px; line-height: 1.2; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    padding: 12px 18px; font-weight: 700; cursor: pointer; align-self: flex-start;
  }
  .btn.quiet { background: var(--surface-2); color: var(--ink); }
  .btn.wide { align-self: stretch; }

  .list { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .row .t { font-weight: 700; }
  .row .s { color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
  .row.link { cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; padding-left: 0; padding-right: 0; }
  .row.link:hover .t { color: var(--accent); }

  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.02em; }
  .chip.wait { background: var(--wait-soft); color: var(--wait); }
  .chip.doing { background: var(--doing-soft); color: var(--doing); }
  .chip.done { background: var(--done-soft); color: var(--done); }

  .doors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .door { background: var(--surface-2); border: 0; border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .door b { font-size: 15px; }
  .door span { font-size: 12px; color: var(--muted); }

  .group { display: flex; flex-direction: column; gap: 8px; }
  .group h3 { display: flex; justify-content: space-between; align-items: baseline; }
  .group h3 small { font-family: "Atkinson Hyperlegible", sans-serif; font-weight: 400; font-size: 13px; color: var(--muted); }

  .q { display: flex; flex-direction: column; gap: 6px; }
  .q .ask { font-size: 19px; line-height: 1.35; }
  .q .why { color: var(--muted); font-size: 14px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 12px; align-items: start;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; background: var(--surface);
  }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt input { margin: 3px 0 0; accent-color: var(--accent); width: 18px; height: 18px; }
  .opt .k { font-weight: 700; }
  .opt .c { grid-column: 2; font-size: 14px; color: var(--muted); }
  .opt .tag { grid-column: 2; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .opt .tag.rec { color: var(--accent); }
  .opt .tag.def { color: var(--muted); }
  textarea {
    width: 100%; min-height: 72px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font: inherit; background: var(--surface); color: var(--ink); resize: vertical;
  }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .actions .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .trail { display: flex; flex-direction: column; gap: 0; }
  .step { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; font-size: 14px; }
  .step .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); margin-top: 6px; }
  .step .dot.done { background: var(--done); }
  .step .dot.doing { background: var(--doing); }
  .step .body { padding-bottom: 12px; border-left: 0; }
  .step .body b { display: block; }
  .step .body span { color: var(--muted); }
  .ready { display: flex; flex-direction: column; gap: 6px; }
  .ready .r { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; font-size: 14px; }
  .ready .r b { font-weight: 700; }
  .try { display: flex; gap: 8px; flex-wrap: wrap; }
  .try a { font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--ink); padding: 6px 10px; border-radius: 999px; text-decoration: none; }
  .msgs { display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
  .msg .who { font-size: 12px; color: var(--muted); font-weight: 700; }
  .msg .who .tag { font-weight: 400; }
  .msg details { font-size: 13px; color: var(--muted); }
  .msg summary { cursor: pointer; }
  .msg.you { border-left: 3px solid var(--accent); padding-left: 10px; }
  .why { display: flex; flex-direction: column; gap: 4px; font-size: 14px; border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); }
  .why b { color: var(--ink); }
  .say { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
  .say button.open { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer; }
  .say textarea { min-height: 56px; }
  .say .row2 { display: flex; gap: 8px; }
  .say .sent { font-size: 13px; color: var(--done); font-weight: 700; }
  .toast { background: var(--done-soft); color: var(--done); border-radius: 12px; padding: 12px 14px; font-weight: 700; display: none; }
  .toast.on { display: block; }

  .story { font-size: 15px; display: flex; flex-direction: column; gap: 10px; }
  .story p { max-width: 62ch; }
  .story .react { font-size: 12px; color: var(--muted); }
  .story .react button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 700; }
  .chapters .row .t small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .qchip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--done-soft); color: var(--done); vertical-align: middle; }
  .day h3 { font-size: 15px; color: var(--muted); font-family: "Atkinson Hyperlegible", sans-serif; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .day ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .ideabox { display: flex; flex-direction: column; gap: 8px; }
  @media (prefers-reduced-motion: no-preference) { .screen.on { animation: in 160ms ease-out; } }
  @keyframes in { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Standalone site additions */
  a.back, a.door, a.row.link, a.btn { text-decoration: none; }
  a.back { display: inline-block; }
  a.row.link, a.door { color: inherit; }
  a.row.link:hover .t { color: var(--accent); }
  .row .lead { grid-column: 2; }
  .foot { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  .qchip.wait { background: var(--wait-soft); color: var(--wait); text-decoration: none; }
  .qchip.doing { background: var(--doing-soft); color: var(--doing); text-decoration: none; }
  .qchip.done { background: var(--done-soft); color: var(--done); text-decoration: none; }
  .doc { font-size: 16px; }
  .doc h1 { font-size: 24px; margin-top: 8px; }
  .doc h2 { font-size: 20px; margin-top: 18px; }
  .doc h3 { font-size: 17px; margin-top: 12px; }
  .doc h4 { margin: 10px 0 0; font-size: 15px; }
  .doc p { max-width: none; }
  .doc ul, .doc ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
  .doc blockquote { margin: 0; padding: 4px 0 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .doc table { border-collapse: collapse; font-size: 14px; width: 100%; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .doc th { background: var(--surface-2); }
  .doc .table-wrap, .doc table { display: block; overflow-x: auto; max-width: 100%; }
  .doc pre { overflow-x: auto; background: var(--surface-2); padding: 10px 12px; border-radius: 10px; font-size: 13px; }
  .doc code { font-size: 0.92em; }
  .doc img { max-width: 100%; border-radius: 10px; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  .doc details.diagram { font-size: 14px; color: var(--muted); }
  .doc details.diagram summary { cursor: pointer; }
  .doc pre.mermaid { background: none; text-align: center; }
  .story p:hover, .doc p:hover { cursor: text; }
  .para-say { margin: -2px 0 6px; }
  .day + .day { margin-top: 6px; }
  .toast a { color: inherit; }
  textarea, input { font-size: 16px; }

</style>
</head>
<body>
<main class="desk" id="app">
  <section class="screen on" aria-busy="true">
    <div><h2>Opening your Desk…</h2><p class="lead">One moment.</p></div>
  </section>
</main>

<script>
/* The Desk. One page, built from the repository, that says what needs you and lets you answer by
   tapping. Everything you do here becomes a note on GitHub that the ledger reads; nothing here is
   a server. Plain JavaScript, no framework, and no script loaded from anywhere else: the page
   holds decrypted data and the passphrase, so nothing but this file runs here. */
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const app = $('#app');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('desk.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('desk.' + k, JSON.stringify(v)); } catch { /* private window, fine */ } },
  };
  let D = null;                          // the data payload
  let pending = store.get('pending', {}); // answers sent from here, until the files catch up
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /* ---------- boot ---------- */
  async function boot() {
    let raw = JSON.parse($('#desk-data').textContent);
    if (raw.protected) {
      const pass = store.get('pass', null);
      if (pass) { try { raw = JSON.parse(await decrypt(raw.payload, pass)); } catch { store.set('pass', null); raw = await askPass(raw); } }
      else raw = await askPass(raw);
    }
    D = raw;
    // Remember the previous visit so "since you last looked" means it.
    const now = Date.now(); const cur = store.get('visit', null);
    if (!cur || now - cur > 20 * 60 * 1000) { if (cur) store.set('last', cur); store.set('visit', now); }
    // Drop remembered answers the files have caught up with, or that are older than three days.
    for (const id of Object.keys(pending)) { const q = D.questions.find((x) => x.id === id); if (!q || q.status !== 'waiting' && q.status !== 'deferred' || now - pending[id].at > 3 * 86400000) delete pending[id]; }
    store.set('pending', pending);
    window.addEventListener('hashchange', route);
    route();
  }
  function askPass(raw) {
    return new Promise((resolve) => {
      app.innerHTML = `<section class="screen on"><div><h2>Your Desk</h2><p class="lead">This page is private. Type the passphrase ${esc(raw.hint || '')} once; this phone remembers it.</p></div>
        <form id="pass"><input type="password" autocomplete="current-password" placeholder="Passphrase" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--surface);color:var(--ink)"><p class="lead" id="pass-err" style="color:var(--wait)"></p><button class="btn wide" type="submit" style="margin-top:8px">Open</button></form></section>`;
      $('#pass input').focus();
      $('#pass').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p = $('#pass input').value;
        try { const json = JSON.parse(await decrypt(raw.payload, p)); store.set('pass', p); resolve(json); }
        catch { $('#pass-err').textContent = 'That is not it. Try again, or ask for the passphrase.'; }
      });
    });
  }
  async function decrypt(b64, pass) {
    const buf = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const rawKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: buf.slice(0, 16), iterations: 210000, hash: 'SHA-256' }, rawKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28)));
  }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function human(iso) {
    if (!iso) return '';
    const d = new Date(String(iso).slice(0, 10) + 'T12:00:00Z'); const n = new Date();
    const diff = Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), 12) - d.getTime()) / 86400000);
    if (diff === 0) return 'today'; if (diff === 1) return 'yesterday'; if (diff > 1 && diff < 7) return DAYS[d.getUTCDay()];
    if (diff < 0 && diff > -7) return 'next ' + DAYS[d.getUTCDay()];
    return DAYS[d.getUTCDay()].slice(0, 3) + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
  }
  function today() { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); }
  function lc(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
  function q(id) { return D.questions.find((x) => x.id === id); }
  function stage(x) { // wait | doing | done | gone, with answers sent from here counted as doing
    if (pending[x.id] && (x.status === 'waiting' || x.status === 'deferred')) return pending[x.id].action === 'defer' ? 'wait' : 'doing';
    return x.status === 'waiting' || x.status === 'deferred' ? 'wait' : x.status === 'decided' ? 'doing' : x.status === 'withdrawn' ? 'gone' : 'done';
  }
  function answerText(x) {
    const p = pending[x.id];
    if (p && stage(x) === 'doing') return p.answer ? p.answer + ': ' + lc(optText(x, p.answer)) : 'in your words: “' + p.note + '”';
    if (!x.answer) return '';
    const o = x.options.find((y) => y.key === x.answer);
    return o ? x.answer + ': ' + lc(o.text.replace(/\.$/, '')) : x.answer;
  }
  function optText(x, key) { const o = x.options.find((y) => y.key === key); return o ? o.text.replace(/\.$/, '') : key; }
  function chip(x) {
    const s = stage(x);
    if (s === 'wait') return x.status === 'deferred' ? `<span class="chip wait">Back ${esc(human(x.resurface))}</span>` : `<span class="chip wait">${esc(x.time)}</span>`;
    if (s === 'doing') return '<span class="chip doing">Being written in</span>';
    return x.status === 'superseded' ? '<span class="chip done">Replaced</span>' : '<span class="chip done">Done</span>';
  }
  function qchipLabel(x) {
    const s = stage(x);
    return x.id + ' · ' + (s === 'wait' ? (x.owner === 'product' ? 'waiting for you' : 'waiting for ' + D.names.engineering) : s === 'doing' ? 'decided ' + (answerText(x).split(':')[0]) + ', being written in' : x.status === 'superseded' ? 'replaced by ' + x.superseded_by : 'decided ' + (x.answer || ''));
  }
  function fillChips(root) {
    (root || app).querySelectorAll('a.qchip[data-q]').forEach((a) => { const x = q(a.dataset.q); if (x) { a.textContent = qchipLabel(x); a.className = 'qchip ' + stage(x); } });
  }
  function waitingForYou() { return D.questions.filter((x) => x.owner === 'product' && stage(x) === 'wait' && x.status === 'waiting').sort((a, b) => (a.page_number || 999) - (b.page_number || 999)); }
  function groups(list) { const g = new Map(); for (const x of list) { const k = x.blocks[0] ? x.blocks[0].label : 'Whenever you have a minute'; if (!g.has(k)) g.set(k, []); g.get(k).push(x); } return g; }
  function lastLooked() { const t = store.get('last', null); return t ? new Date(t).toISOString().slice(0, 10) : null; }
  function sinceItems() {
    const last = lastLooked(); const week = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    const cut = last && last < week ? last : (last || week);
    let items = D.since.filter((s) => s.at >= cut);
    if (!items.length) items = D.since.filter((s) => s.at >= week);
    return items.slice(0, 8);
  }
  function chapter(slug) { return D.chapters.find((c) => c.slug === slug); }
  function chapterFor(x) { const b = x.blocks.find((y) => y.chapter); return b ? chapter(b.chapter) : null; }
  function whereLink(x) {
    const c = chapterFor(x); if (c) return `<a href="#/plan/${c.slug}">${esc(c.title)}</a>`;
    const w = x.written_into.find((y) => y.chapter); if (w) return `<a href="${w.href}">${esc(w.label)}</a>`;
    if (x.origin) return `<a href="${esc(x.origin.href)}" target="_blank" rel="noopener">${esc(x.origin.label)}</a>`;
    return 'the plan';
  }

  /* ---------- GitHub hand-off: every action here becomes one small note on GitHub ---------- */
  function issueUrl(title, body) { return D.new_issue_url + '?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body); }
  function packet(kind, obj, lead) {
    return `${lead}\n\nPress **Submit new issue** at the bottom and you are done. The Desk reads this note within a minute; you can close this tab.\n\n\`\`\`json\n${JSON.stringify(obj, null, 2)}\n\`\`\`\n`;
  }
  function send(kind, obj, title, lead) {
    const url = issueUrl(title, packet(kind, obj, lead));
    const w = window.open(url, '_blank');
    if (w) { try { w.opener = null; } catch { /* fine */ } } else location.href = url;
  }
  function saveAnswer(x, action, key, note) {
    const obj = { question: x.id, action };
    if (action === 'save') { if (key) obj.answer = key; if (note) obj.note = note; }
    pending[x.id] = { action, answer: key || null, note: note || '', at: Date.now() }; store.set('pending', pending);
    const what = action === 'defer' ? 'not sure, ask me later' : action === 'you-pick' ? 'you pick' : key ? key + (note ? ' · ' + note : '') : '“' + note + '”';
    send('answer', obj, `Answer: ${x.id} ${action === 'save' ? (key || 'in my words') : action}`, `**${x.title}** · ${what}\n\nSent from the Desk by ${D.names.product}.`);
  }
  function sayAbout(x, text, about) {
    const obj = x ? { question: x.id, text } : { text, about };
    send('reaction', obj, `Reaction: ${x ? x.id : (about || '').slice(0, 60)}`, `${D.names.product} says, about **${esc(x ? x.title : about)}**:\n\n> ${text.replace(/\n/g, '\n> ')}`);
  }
  function sendIdea(text) { send('idea', { text }, `Idea: ${text.slice(0, 60)}`, `**Idea from ${D.names.product}**\n\n> ${text.replace(/\n/g, '\n> ')}`); }

  /* ---------- routing ---------- */
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const [page, arg] = h.split('/');
    const views = { '': home, questions: questions, q: card, plan: plan, ideas: ideas, try: tryIt, happened: happened, conversations: conversations, yosef: forEngineering };
    const view = views[page] || home;
    app.innerHTML = `<section class="screen on">${view(arg)}</section>`;
    fillChips();
    window.scrollTo(0, 0);
  }
  function back(to, label) { return `<a class="back" href="#/${to}">← ${esc(label)}</a>`; }
  function footer() { return `<p class="lead foot">Built from the files ${esc(human(D.generated))}. <a href="${esc(D.page_issue_url || D.repo_url)}" target="_blank" rel="noopener">Your page on GitHub</a> · <a href="#/yosef">For ${esc(D.names.engineering)}</a> · <a href="${esc(D.engineers_url)}" target="_blank" rel="noopener">For engineers</a></p>`; }

  /* ---------- home ---------- */
  function home() {
    const waiting = waitingForYou();
    const back = D.questions.filter((x) => x.owner === 'product' && x.status === 'deferred' && x.resurface && x.resurface <= today());
    const doing = D.questions.filter((x) => x.owner === 'product' && stage(x) === 'doing');
    const mins = waiting.reduce((a, x) => a + (parseInt(x.time) || 2), 0);
    const g = groups(waiting);
    const n = waiting.length;
    const line = n ? `${n === 1 ? 'One question is' : n + ' questions are'} waiting for you. About ${mins} minute${mins === 1 ? '' : 's'}.`
      : back.length ? 'You asked us to come back to one question.' : `Nothing needs you.${doing.length ? ` ${doing.length} of your answers ${doing.length === 1 ? 'is' : 'are'} being written in.` : ''}`;
    const eng = D.questions.filter((x) => x.owner === 'engineering' && stage(x) === 'wait');
    const since = sinceItems();
    const d = new Date();
    return `
      <div><p class="lead">${esc(DAYS[d.getDay()])}, ${d.getDate()} ${MONTHS[d.getMonth()]}</p><h2>Hi ${esc(D.names.product)}</h2></div>
      <div class="next">
        <div class="eyebrow">Next for you</div>
        <p class="big">${esc(line)}</p>
        ${g.size ? `<div class="ready">${[...g].map(([k, v]) => `<div class="r"><b>${esc(k)}</b><span>${v.length === 1 ? 'one thing' : v.length + ' things'}</span></div>`).join('')}</div>` : ''}
        ${n ? `<a class="btn" href="#/questions">${n === 1 ? 'Answer it' : 'Answer them'}</a>` : ''}
        ${eng.length ? `<p class="lead">${eng.length === 1 ? 'One thing waits' : eng.length + ' things wait'} on ${esc(D.names.engineering)}. <a href="#/yosef">See them</a>.</p>` : ''}
      </div>
      <div class="group">
        <h3>Since you last looked <small>${esc(lastLooked() ? human(lastLooked()) : 'this week')}</small></h3>
        <div class="list">${since.length ? since.map((s, i) => sinceRow(s, i)).join('') : '<div class="row"><span class="s">Nothing new since your last visit.</span></div>'}</div>
      </div>
      <div class="doors">
        <a class="door" href="#/plan"><b>Read the plan</b><span>Story first</span></a>
        <a class="door" href="#/try"><b>Try it</b><span>Prototype</span></a>
        <a class="door" href="#/ideas"><b>Ideas</b><span>Drop one</span></a>
      </div>
      <p class="lead"><a href="#/conversations">Conversations</a> · <a href="#/happened">What happened, day by day</a> · <a href="#/questions">Everything you decided</a></p>
      ${footer()}`;
  }
  function sinceRow(s, i) {
    const x = s.q ? q(s.q) : null;
    const to = s.to === 'engineering' ? D.names.engineering : 'the assistant';
    return `<div class="row"><span class="t">${s.html}</span><span class="lead">${esc(human(s.at))}</span>
      ${x ? `<span class="s"><a href="#/q/${x.id}">Open it</a></span>` : ''}
      <div class="say" data-q="${x ? x.id : ''}" data-to="${esc(to)}" data-about="${esc(x ? x.title : s.text)}"><button class="open" type="button">Say something</button></div></div>`;
  }

  /* ---------- questions ---------- */
  function row(x, num) {
    const s = stage(x);
    const sub = s === 'wait' ? `${esc(x.ask)}${x.default ? ` <em>If you leave it blank: ${esc(x.default)}.</em>` : ''}` : s === 'doing' ? `You answered: ${esc(answerText(x))}. Being written in.` : `Decided: ${esc(answerText(x))}${x.written_into.length ? '. Written into ' + x.written_into.filter((w) => w.chapter).map((w) => esc(w.label)).join(', ') || 'the documents' : ''}.`;
    return `<a class="row link" href="#/q/${x.id}"><span class="t">${num ? num + '. ' : ''}${esc(x.title)}</span>${chip(x)}<span class="s">${sub}</span></a>`;
  }
  function questions() {
    const waiting = waitingForYou(); const g = groups(waiting);
    const deferred = D.questions.filter((x) => x.owner === 'product' && x.status === 'deferred');
    const doing = D.questions.filter((x) => x.owner === 'product' && stage(x) === 'doing');
    const done = D.questions.filter((x) => x.owner === 'product' && stage(x) === 'done').sort((a, b) => (b.answered || '').localeCompare(a.answered || ''));
    return `${back('', 'Home')}
      <div><h2>Your questions</h2><p class="lead">Tap one. Answer as many or as few as you like, in any order. Leave one blank and we go with the recommended choice.</p></div>
      ${g.size ? [...g].map(([k, v]) => `<div class="group"><h3>${esc(k)} <small>${v.length}</small></h3><div class="list">${v.map((x) => row(x, x.page_number)).join('')}</div></div>`).join('') : '<div class="group"><h3>Waiting for you <small>0</small></h3><div class="list"><div class="row"><span class="s">Nothing right now.</span></div></div></div>'}
      ${deferred.length ? `<div class="group"><h3>You said: ask me later <small>${deferred.length}</small></h3><div class="list">${deferred.map((x) => row(x)).join('')}</div></div>` : ''}
      <div class="group"><h3>Answered, being written in <small>${doing.length}</small></h3><div class="list">${doing.length ? doing.map((x) => row(x)).join('') : '<div class="row"><span class="s">Nothing here.</span></div>'}</div></div>
      <div class="group"><h3>Done <small>${done.length}</small></h3><div class="list">${done.length ? done.map((x) => row(x)).join('') : '<div class="row"><span class="s">Nothing here yet.</span></div>'}</div></div>
      ${footer()}`;
  }
  function forEngineering() {
    const wait = D.questions.filter((x) => x.owner === 'engineering' && stage(x) === 'wait');
    const rest = D.questions.filter((x) => x.owner === 'engineering' && stage(x) !== 'wait' && stage(x) !== 'gone').sort((a, b) => (b.answered || '').localeCompare(a.answered || ''));
    return `${back('', 'Home')}
      <div><h2>${esc(D.names.engineering)}'s questions</h2><p class="lead">Decisions that are ${esc(D.names.engineering)}'s to make. You can read them and say something; the answer is ${esc(D.names.engineering)}'s.</p></div>
      <div class="group"><h3>Waiting on ${esc(D.names.engineering)} <small>${wait.length}</small></h3><div class="list">${wait.length ? wait.map((x) => row(x)).join('') : '<div class="row"><span class="s">Nothing right now.</span></div>'}</div></div>
      <div class="group"><h3>Decided <small>${rest.length}</small></h3><div class="list">${rest.length ? rest.map((x) => row(x)).join('') : '<div class="row"><span class="s">Nothing yet.</span></div>'}</div></div>
      ${footer()}`;
  }

  /* ---------- one question ---------- */
  function trailStep(x, e) {
    const you = e.by === D.logins.product; const name = you ? 'You' : e.by_name;
    const src = e.source ? ` <a href="${esc(e.source)}" target="_blank" rel="noopener">see it</a>` : '';
    switch (e.kind) {
      case 'asked': return ['done', `Asked ${human(e.at)}`, `${e.by === 'assistant' || e.by === 'ledger' ? 'by the assistant' : 'by ' + e.by_name}${x.origin ? `, from <a href="${esc(x.origin.href)}" target="_blank" rel="noopener">${esc(x.origin.label)}</a>` : ''}${e.source_note ? ` (${esc(e.source_note)})` : ''}`];
      case 'shaped': return ['done', `Choices shaped ${human(e.at)}`, 'by the assistant'];
      case 'answered': return ['done', `${name} answered ${human(e.at)}: ${esc(e.value)}${e.delegated ? ' (you let us pick)' : ''}`, (x.answer_note && x.answer === e.value ? `“${esc(x.answer_note)}”` : '') + src];
      case 'reanswered': return ['doing', `${name} answered again ${human(e.at)}: ${esc(e.value)}`, `So it is one question again: <a href="#/q/${esc(e.follow_up)}">${esc(e.follow_up)}</a>.`];
      case 'deferred': return ['doing', `${name} said ${human(e.at)}: not sure, ask me later`, `Back on ${human(e.until)}.`];
      case 'resurfaced': return ['doing', `Back on the page ${human(e.at)}`, ''];
      case 'written-in': return ['done', `Written in ${human(e.at)}`, x.written_into.length ? 'into ' + x.written_into.map((w) => `<a href="${esc(w.href)}"${w.chapter ? '' : ' target="_blank" rel="noopener"'}>${esc(w.label)}</a>`).join(', ') : 'the documents'];
      case 'superseded': return ['done', `Replaced ${human(e.at)}`, `by <a href="#/q/${esc(e.by)}">${esc(e.by)}</a>`];
      case 'withdrawn': return ['done', `Withdrawn ${human(e.at)}`, esc(e.reason || '')];
      case 'proposed': return ['doing', `${name} proposed a choice ${human(e.at)}: ${esc(e.value)}`, src];
      case 'reopen-requested': return ['doing', `${name} asked to reopen this ${human(e.at)}`, src];
      case 'reacted': return ['doing', `${name} said something ${human(e.at)}`, src];
      default: return null;
    }
  }
  function card(id) {
    const x = q(id);
    if (!x) return `${back('questions', 'Your questions')}<div><h2>Not here</h2><p class="lead">There is no question ${esc(id)}.</p></div>`;
    const s = stage(x); const mine = x.owner === 'product'; const open = s === 'wait' && mine && !pending[x.id];
    const p = pending[x.id];
    const opts = x.options.map((o) => `
      <label class="opt"><input type="radio" name="opt" value="${esc(o.key)}" ${(x.answer === o.key || (p && p.answer === o.key)) ? 'checked' : ''} ${open ? '' : 'disabled'}>
        <span class="k">${esc(o.key)}. ${esc(o.text)}</span>
        ${o.consequence ? `<span class="c">${esc(o.consequence)}</span>` : ''}
        ${o.proposed_by ? `<span class="c">Proposed by ${esc(o.proposed_by)}.</span>` : ''}
        ${o.key === x.recommended && !x.answer ? '<span class="tag rec">Recommended</span>' : ''}
        ${o.key === x.default && !x.answer && o.key !== x.recommended ? '<span class="tag def">What happens if you leave it blank</span>' : ''}
        ${o.key === x.default && !x.answer && o.key === x.recommended ? '<span class="tag def">Also what happens if you leave it blank</span>' : ''}
        ${x.answer === o.key ? '<span class="tag rec">Your choice</span>' : ''}
      </label>`).join('');
    const trail = x.events.map((e) => trailStep(x, e)).filter(Boolean);
    if (s === 'wait' && !p) trail.push(['', mine ? 'Waiting for you' : `Waiting for ${D.names.engineering}`, x.default && mine ? `If you leave it blank: ${x.default}.` : '']);
    if (p) trail.push(['doing', p.action === 'defer' ? 'You said: not sure, ask me later' : `You answered ${human(today())}: ${p.answer || 'in your own words'}`, 'Sent from the Desk a moment ago. It shows here for good once the Desk has read it.']);
    if (s === 'doing' && !p) trail.push(['doing', `Being written into ${chapterFor(x) ? esc(chapterFor(x).title) : 'the documents'}`, 'You will see where.']);
    const conv = conversation(x);
    const chipText = s === 'wait' ? (mine ? 'Waiting for you' : `Waiting for ${D.names.engineering}`) + (x.blocks[0] ? ' · ' + lc(x.blocks[0].label) : '') : s === 'doing' ? 'Being written in' : x.status === 'superseded' ? 'Replaced' : 'Done';
    return `${back(mine ? 'questions' : 'yosef', mine ? 'Your questions' : D.names.engineering + "'s questions")}
      <div class="q"><span class="chip ${s === 'wait' ? 'wait' : s}">${esc(chipText)}</span><h2>${esc(x.title)}</h2><p class="ask">${esc(x.ask)}</p>${x.why_html ? `<p class="why">${x.why_html}</p>` : ''}</div>
      ${!mine ? `<p class="lead">This one is ${esc(D.names.engineering)}'s to decide. Say something below if it matters to you.</p>` : ''}
      <form id="card-form" class="opts">${opts || '<p class="lead">The assistant is still shaping the choices. You can answer in your own words below.</p>'}</form>
      ${s === 'done' ? `<div class="why"><span><b>${x.delegated ? 'You let us pick' : 'You chose'}:</b> ${esc(answerText(x))}</span>${x.answer_note && x.answer_note !== x.answer ? `<span><b>Your words:</b> “${esc(x.answer_note)}”</span>` : ''}${x.written_into.length ? `<span><b>Written into:</b> ${x.written_into.map((w) => `<a href="${esc(w.href)}"${w.chapter ? '' : ' target="_blank" rel="noopener"'}>${esc(w.label)}</a>`).join(', ')}</span>` : ''}${x.superseded_by ? `<span><b>Replaced by:</b> <a href="#/q/${esc(x.superseded_by)}">${esc(x.superseded_by)}</a></span>` : ''}</div>` : ''}
      ${open ? `<div><label for="own" class="lead" style="display:block;margin-bottom:6px">In your own words, if you'd rather. Or add a sentence to your choice.</label><textarea id="own" placeholder="Optional"></textarea></div>
      <div class="toast" id="toast"></div>
      <div class="actions"><button class="btn wide" type="button" data-act="save" data-q="${x.id}">Save</button><div class="pair"><button class="btn quiet" type="button" data-act="defer" data-q="${x.id}">Not sure, ask me later</button><button class="btn quiet" type="button" data-act="you-pick" data-q="${x.id}">You pick</button></div></div>
      <p class="lead">Saving opens GitHub with a short note already written; press <b>Submit new issue</b> there and you are done.</p>` : ''}
      ${p ? `<div class="toast on">${p.action === 'defer' ? 'No problem. It comes back in a week.' : 'Thanks. We will write it in and show you where.'} If GitHub did not open, <button class="open" type="button" data-resend="${x.id}">send it again</button>.</div>` : ''}
      <p class="lead">Where this is worked out: ${whereLink(x)}</p>
      <div class="group"><h3>The trail</h3><div class="trail">${trail.map(([c, b, d]) => `<div class="step"><span class="dot ${c}"></span><span class="body"><b>${b}</b>${d ? `<span>${d}</span>` : ''}</span></div>`).join('')}</div></div>
      <div class="group"><h3>The conversation</h3><div class="msgs">${conv.length ? conv.join('') : '<p class="lead">Nobody has said anything about this yet.</p>'}</div>
        <div class="say" data-q="${x.id}" data-to="${esc(mine ? 'the assistant' : D.names.engineering)}" data-about="${esc(x.title)}" data-reply="1"><button class="open" type="button">Say something about this</button></div></div>
      ${footer()}`;
  }
  function conversation(x) {
    const items = [];
    for (const n of x.notes) items.push({ at: n.at, you: n.by === D.logins.product, who: n.by === D.logins.product ? 'You' : n.by_name, tag: n.role, text: n.text, source: n.source });
    for (const e of x.events) if (e.kind === 'answered' && x.answer_note && e.value === x.answer) items.push({ at: e.at, you: e.by === D.logins.product, who: e.by === D.logins.product ? 'You' : e.by_name, tag: 'with the answer', text: x.answer_note, source: e.source });
    items.sort((a, b) => (a.at || '').localeCompare(b.at || ''));
    return items.map((m) => `<div class="msg ${m.you ? 'you' : ''}"><span class="who">${esc(m.who)} <span class="tag">· ${esc(m.tag)}${m.at ? ', ' + esc(human(m.at)) : ''}</span></span><span>${esc(m.text)}</span>${m.source ? `<details><summary>Where they wrote it</summary><a href="${esc(m.source)}" target="_blank" rel="noopener">${esc(m.source.replace(/^https?:\/\/github\.com\//, ''))}</a></details>` : ''}</div>`);
  }

  /* ---------- the plan ---------- */
  function chapterChip(c) {
    const open = D.questions.filter((x) => x.owner === 'product' && stage(x) === 'wait' && x.status === 'waiting' && x.blocks.some((b) => b.chapter === c.slug));
    if (open.length) return `<span class="chip wait">${open.length === 1 ? '1 question' : open.length + ' questions'}</span>`;
    const week = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    if (c.changed && c.changed >= week) return `<span class="chip doing">Changed ${esc(human(c.changed))}</span>`;
    if ((store.get('read', {}))[c.slug]) return '<span class="chip done">Read</span>';
    return '<span></span>';
  }
  function plan(slug) {
    if (slug) return chapterView(slug);
    const story = D.story ? chapter(D.story) : null;
    const rest = D.chapters.filter((c) => !c.story);
    const sections = new Map();
    for (const c of rest) { const k = c.section || 'The chapters'; if (!sections.has(k)) sections.set(k, []); sections.get(k).push(c); }
    return `${back('', 'Home')}
      ${story ? `<div><h2>${esc(story.title)}</h2><p class="lead">${esc(story.line || 'If you read one thing, read this.')}${story.time ? ' ' + esc(story.time) + '.' : ''}</p></div><div class="story" data-chapter="${story.slug}">${story.html}</div><div class="say" data-q="" data-to="the assistant" data-about="${esc(story.title)}"><button class="open" type="button">Say something about this</button></div>` : '<div><h2>The plan</h2><p class="lead">Every chapter, in reading order.</p></div>'}
      ${[...sections].map(([k, v]) => `<div class="group chapters"><h3>${esc(k)} <small>${esc(sumTime(v))}</small></h3><div class="list">${v.map((c) => `<a class="row link" href="#/plan/${c.slug}"><span class="t">${esc(c.title)}${c.time ? ` <small>${esc(c.time)}</small>` : ''}</span>${chapterChip(c)}<span class="s">${esc(c.line || c.plain.slice(0, 140))}</span></a>`).join('')}</div></div>`).join('')}
      <p class="lead">For engineers: how it is built lives <a href="${esc(D.engineers_url)}" target="_blank" rel="noopener">with the code</a>. You do not need it.</p>
      ${footer()}`;
  }
  function sumTime(v) { const m = v.reduce((a, c) => a + (parseInt(c.time) || 0), 0); return m ? `about ${m} min` : ''; }
  function chapterView(slug) {
    const c = chapter(slug);
    if (!c) return `${back('plan', 'The plan')}<div><h2>Not here</h2><p class="lead">That chapter is not in the plan any more.</p></div>`;
    const read = store.get('read', {}); read[slug] = today(); store.set('read', read);
    const week = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    const changedBy = D.questions.filter((x) => x.written_into.some((w) => w.chapter === slug) && x.events.some((e) => e.kind === 'written-in' && e.at >= week));
    const open = D.questions.filter((x) => x.owner === 'product' && stage(x) === 'wait' && x.status === 'waiting' && x.blocks.some((b) => b.chapter === slug));
    return `${back('plan', 'The plan')}
      <div><h2>${esc(c.title)}</h2>${c.time ? `<p class="lead">${esc(c.time)}${c.look_for ? '. ' + esc(c.look_for) : ''}</p>` : ''}</div>
      ${changedBy.length ? `<div class="toast on">Changed ${esc(human(c.changed || changedBy[0].answered))}: ${changedBy.map((x) => `${x.owner === 'product' ? 'your answer' : D.names.engineering + "'s answer"} on <a href="#/q/${x.id}">${esc(lc(x.title))}</a>`).join(', ')}.</div>` : c.changed && c.changed >= week ? `<div class="toast on">Changed ${esc(human(c.changed))}.</div>` : ''}
      ${open.length ? `<div class="next"><div class="eyebrow">Waiting on you for this chapter</div>${open.map((x) => `<p><a href="#/q/${x.id}">${esc(x.title)}</a></p>`).join('')}</div>` : ''}
      <article class="story doc" data-chapter="${slug}">${c.html}</article>
      <div class="say" data-q="" data-to="the assistant" data-about="${esc(c.title)}"><button class="open" type="button">Say something about this chapter</button></div>
      ${footer()}`;
  }
  /* ---------- ideas, try it, what happened, conversations ---------- */
  function ideas() {
    const chipFor = { new: 'wait', 'being discussed': 'doing', 'in the plan': 'done', later: 'doing' };
    return `${back('', 'Home')}
      <div><h2>Ideas</h2><p class="lead">A sentence is plenty. You will be told what became of it.</p></div>
      <div class="ideabox"><textarea id="idea" placeholder="What's the idea?"></textarea><button class="btn" type="button" data-idea="1">Send</button></div>
      <div class="list">${D.ideas.length ? D.ideas.map((i) => `<div class="row"><span class="t">${esc(i.title)}</span><span class="chip ${chipFor[i.status] || 'doing'}">${esc(i.status)}</span><span class="s">${i.date ? esc(human(i.date)) + (i.from ? ', from ' + esc(i.from) : '') + '. ' : ''}${i.meta ? esc(i.meta) + ' ' : ''}${i.html}</span></div>`).join('') : '<div class="row"><span class="s">No ideas recorded yet. Yours would be the first.</span></div>'}</div>
      ${footer()}`;
  }
  function tryIt() {
    return `${back('', 'Home')}
      <div><h2>Try it</h2><p class="lead">Nothing in the prototype is real or stored. To pin a note anywhere: add <b>?pd=1</b> to the address, tap <b>Add note</b>, tap the spot, write. Then <b>Send to the team</b>; it comes back here.</p></div>
      <div class="list">${D.try.map((t) => `<a class="row link" href="${esc(t.url)}" target="_blank" rel="noopener"><span class="t">${esc(t.title)}</span><span class="chip doing">Open</span><span class="s">${esc(t.blurb)}</span></a>`).join('') || '<div class="row"><span class="s">No prototype yet.</span></div>'}</div>
      <div class="group"><h3>Your notes <small>${D.notes.reduce((a, n) => a + n.notes.length, 0)}</small></h3>
        ${D.notes.length ? D.notes.map((n) => `<div class="day"><h3>${esc(n.page_label)} · ${esc(human(n.date))}${n.issue ? ` · <a href="${esc(n.issue.url)}" target="_blank" rel="noopener">note #${n.issue.number}</a>` : ''}</h3>
          ${n.became.length ? `<p class="lead">Became ${n.became.map((b) => `<a href="#/q/${b.id}">${esc(b.title)}</a>`).join(', ')}.</p>` : '<p class="lead">Read by the team; what became of it is on your page.</p>'}
          <ul>${n.notes.map((m) => `<li>${esc(m.text)}${m.near ? ` <span class="lead">(near “${esc(m.near)}”)</span>` : ''}</li>`).join('')}</ul></div>`).join('') : '<p class="lead">No notes yet.</p>'}
      </div>
      ${footer()}`;
  }
  function happened() {
    const only = store.get('onlyYou', true);
    const days = D.happened.map((d) => ({ date: d.date, items: d.items.filter((i) => !only || i.you) })).filter((d) => d.items.length);
    return `${back('', 'Home')}
      <div><h2>What happened</h2><label class="toggle"><input type="checkbox" id="only-you" ${only ? 'checked' : ''}> Only things that involve you</label></div>
      ${days.length ? days.slice(0, 60).map((d) => `<div class="day"><h3>${esc(human(d.date))}${human(d.date).length < 10 ? ' · ' + esc(d.date) : ''}</h3><ul>${d.items.map((i) => `<li>${i.q ? `<a href="#/q/${i.q}">${esc(i.text)}</a>` : i.href ? `<a href="${esc(i.href)}" target="_blank" rel="noopener">${esc(i.text)}</a>` : esc(i.text)}</li>`).join('')}</ul></div>`).join('') : '<p class="lead">Nothing recorded yet.</p>'}
      ${footer()}`;
  }
  function conversations() {
    const list = D.questions.filter((x) => stage(x) !== 'gone' && (x.notes.length || x.events.some((e) => ['reacted', 'reopen-requested', 'proposed', 'reanswered'].includes(e.kind))))
      .map((x) => ({ x, last: [...x.notes.map((n) => n.at), ...x.events.map((e) => e.at)].sort().pop() || '', people: [...new Set([...x.notes.map((n) => n.by_name), ...x.events.filter((e) => e.by && e.by !== 'ledger').map((e) => e.by_name)])] }))
      .sort((a, b) => b.last.localeCompare(a.last));
    return `${back('', 'Home')}
      <div><h2>Conversations</h2><p class="lead">Threads that involve you, whether or not they need a decision. Newest first.</p></div>
      <div class="list">${list.length ? list.map(({ x, last, people }) => `<a class="row link" href="#/q/${x.id}"><span class="t">${esc(x.title)}</span>${chip(x)}<span class="s">${esc(people.join(', '))}. ${x.notes.length ? x.notes.length + (x.notes.length === 1 ? ' message' : ' messages') + '. ' : ''}Last ${esc(human(last))}.</span></a>`).join('') : '<div class="row"><span class="s">No conversations yet. Say something on any question and it starts one.</span></div>'}</div>
      ${footer()}`;
  }

  /* ---------- clicks ---------- */
  document.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (act) {
      const x = q(act.dataset.q); const kind = act.dataset.act;
      const picked = app.querySelector('input[name="opt"]:checked'); const own = ($('#own') || {}).value || '';
      const toast = $('#toast');
      if (kind === 'save' && !picked && !own.trim()) { toast.textContent = 'Pick a choice, or write a few words below.'; toast.classList.add('on'); return; }
      if (kind === 'you-pick' && !x.recommended && !x.default) { toast.textContent = 'There is no recommendation on this one yet; pick a choice or write a few words.'; toast.classList.add('on'); return; }
      saveAnswer(x, kind, kind === 'save' ? (picked ? picked.value : null) : null, kind === 'save' ? own.trim() : '');
      route(); return;
    }
    const re = e.target.closest('[data-resend]');
    if (re) { const x = q(re.dataset.resend); const p = pending[x.id]; if (p) saveAnswer(x, p.action, p.answer, p.note); return; }
    const openBtn = e.target.closest('.say .open');
    if (openBtn) {
      const box = openBtn.parentElement;
      box.innerHTML = `<textarea placeholder="In your own words. It goes to ${esc(box.dataset.to)}, exactly as you write it."></textarea><div class="row2"><button class="btn" type="button" data-send="1">Send to ${esc(box.dataset.to)}</button><button class="btn quiet" type="button" data-cancel="1">Cancel</button></div>`;
      box.querySelector('textarea').focus(); return;
    }
    const sendBtn = e.target.closest('.say [data-send]');
    if (sendBtn) {
      const box = sendBtn.closest('.say'); const t = box.querySelector('textarea').value.trim(); if (!t) return;
      sayAbout(box.dataset.q ? q(box.dataset.q) : null, t, box.dataset.about);
      box.innerHTML = `<span class="sent">Sent to ${esc(box.dataset.to)}, in your words, once you press Submit on GitHub. ${box.dataset.to === 'the assistant' ? 'The answer comes back here.' : 'If it changes what people would notice, it comes back to you as a question.'}</span>`; return;
    }
    const cancelBtn = e.target.closest('.say [data-cancel]');
    if (cancelBtn) { cancelBtn.closest('.say').innerHTML = '<button class="open" type="button">Say something</button>'; return; }
    const ideaBtn = e.target.closest('[data-idea]');
    if (ideaBtn) { const t = $('#idea').value.trim(); if (!t) return; sendIdea(t); $('#idea').value = ''; ideaBtn.textContent = 'Sent, once you press Submit on GitHub'; return; }
    const para = e.target.closest('.doc p, .story p');
    if (para && !e.target.closest('a, button, textarea, .say')) {
      app.querySelectorAll('.para-say').forEach((n) => n.remove());
      const box = document.createElement('div'); box.className = 'say para-say'; box.dataset.q = ''; box.dataset.to = 'the assistant'; box.dataset.about = (para.closest('[data-chapter]') ? chapter(para.closest('[data-chapter]').dataset.chapter).title + ': ' : '') + '“' + para.textContent.trim().slice(0, 120) + '”';
      box.innerHTML = '<button class="open" type="button">Say something about this paragraph</button>';
      para.after(box);
    }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'only-you') { store.set('onlyYou', e.target.checked); route(); } });

  boot();
})();

</script>
</body>
</html>
